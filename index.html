<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Математическая лаборатория</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>
<header class="lab-header">
  <h1>Математическая лаборатория</h1>
  <p>Тренажёры, где можно двигать параметры и видеть, что происходит.</p>
</header>
<main class="catalog">
  <div class="catalog-tools">
    <input id="q" type="search" placeholder="Поиск: парабола, логарифм, сдвиг…" aria-label="Поиск">
  </div>
  <div id="list" class="grid-cards"></div>
</main>
<script src="catalog.js"></script>
<script>
  const list = document.getElementById("list");
  const q = document.getElementById("q");
  function render() {
    const term = q.value.trim().toLowerCase();
    const items = (window.CATALOG || []).filter(it =>
      !term || [it.title, it.description, it.topic, ...(it.tags || [])].join(" ").toLowerCase().includes(term));
    list.innerHTML = items.length ? "" : '<p class="empty">Ничего не найдено.</p>';
    for (const it of items) {
      const a = document.createElement("a");
      a.className = "lab-card";
      a.href = "labs/" + it.slug + "/index.html";
      a.innerHTML = `<span class="tag"></span><span class="tag"></span><h3></h3><p></p>`;
      const tags = a.querySelectorAll(".tag");
      tags[0].textContent = it.topic; tags[1].textContent = it.grade + " класс";
      a.querySelector("h3").textContent = it.title;
      a.querySelector("p").textContent = it.description;
      list.appendChild(a);
    }
  }
  q.addEventListener("input", render);
  render();
</script>
</body>
</html>
